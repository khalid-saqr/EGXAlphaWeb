name: Deploy EGXResearch Public Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      trading_date: ${{ steps.release-meta.outputs.trading_date }}
      service_worker_version: ${{ steps.release-meta.outputs.service_worker_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use current main payload for pull-request validation
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git checkout origin/main -- data/latest.json data/archive
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('data/latest.json', 'utf8'));
          console.log(`Validating PR code with current main payload: ${payload.trading_date}`);
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate V1 and V2 public wires
        run: node tests/test-public-wire.mjs

      - name: Build production artifact
        run: npm run build

      - name: Capture release metadata
        id: release-meta
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('data/latest.json', 'utf8'));
          const serviceWorker = fs.readFileSync('_site/sw.js', 'utf8');
          const version = serviceWorker.match(/const VERSION = '([^']+)'/);
          if (!version) throw new Error('Unable to derive service-worker version from _site/sw.js');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `trading_date=${payload.trading_date}\nservice_worker_version=${version[1]}\n`
          );
          console.log(`Release metadata: trading_date=${payload.trading_date}; service_worker_version=${version[1]}`);
          NODE

      - name: Verify production output and payload identity
        run: node tests/test-build-output.mjs

      - name: Verify V2 full-universe build
        run: node tests/test-v2-build.mjs

      - name: Verify quantitative product UI and next-day automation compatibility
        run: node tests/test-product-ui.mjs

      - name: Verify institutional homepage
        run: node tests/test-homepage-layout.mjs

      - name: Verify genuine archived-universe fixtures
        run: node tests/test-homepage-payload-fixtures.mjs

      - name: Verify multi-horizon evidence interface
        run: node tests/test-multi-horizon-interface.mjs

      - name: Verify historical backfill evidence provenance
        run: node tests/test-historical-backfill-evidence.mjs

      - name: Verify methodology white paper
        run: node tests/test-methodology-layout.mjs

      - name: Verify English and Arabic localization parity
        run: node tests/test-localization.mjs

      - name: Verify responsive research close footer
        run: node tests/test-footer.mjs

      - name: Verify privacy and territorial access gate
        run: node tests/test-access-gate.mjs

      - name: Verify installable PWA and freshness behavior
        run: node tests/test-pwa.mjs

      - name: Verify final release and publication rollover
        run: node tests/test-release-hardening.mjs

      - name: Verify Pages artifact
        run: npm run verify:pages

      - name: Verify public boundary
        run: node tests/test-no-leakage.mjs

      - name: Verify restricted binary allowlist
        run: node tests/test-no-binaries.mjs

      - name: Upload pull-request QA artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-site
          path: _site
          retention-days: 1

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production publication after Pages deploy
        env:
          EXPECTED_TRADING_DATE: ${{ needs.build.outputs.trading_date }}
          EXPECTED_SW_VERSION: ${{ needs.build.outputs.service_worker_version }}
        run: |
          set -euo pipefail
          live_date=""
          live_sw_version=""
          for attempt in {1..12}; do
            body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://egxresearch.com/data/latest.json?release=${GITHUB_SHA}" || true)"
            if [ -n "$body" ]; then
              live_date="$(printf '%s' "$body" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("trading_date",""))' 2>/dev/null || true)"
              if [ "$live_date" = "$EXPECTED_TRADING_DATE" ]; then
                live_sw="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://egxresearch.com/sw.js?release=${GITHUB_SHA}" || true)"
                live_sw_version="$(printf '%s\n' "$live_sw" | sed -n "s/^const VERSION = '\([^']*\)';$/\1/p" | head -n 1)"
                if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://egxresearch.com/manifest.webmanifest?release=${GITHUB_SHA}" >/dev/null \
                  && [ -n "$live_sw_version" ] \
                  && [ "$live_sw_version" = "$EXPECTED_SW_VERSION" ]; then
                  echo "Production release verified for trading date ${EXPECTED_TRADING_DATE} with service worker ${EXPECTED_SW_VERSION}."
                  exit 0
                fi
              fi
            fi
            echo "Production not converged yet (attempt ${attempt}/12; live_date=${live_date:-unavailable}; expected_date=${EXPECTED_TRADING_DATE}; live_sw=${live_sw_version:-unavailable}; expected_sw=${EXPECTED_SW_VERSION:-unavailable})."
            sleep 5
          done
          echo "Production publication verification failed: live_date=${live_date:-unavailable}, expected_date=${EXPECTED_TRADING_DATE}, live_sw=${live_sw_version:-unavailable}, expected_sw=${EXPECTED_SW_VERSION:-unavailable}."
          exit 1
